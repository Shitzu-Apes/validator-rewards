[package]
name = "contract-migrate"
version = "1.0.0"
authors = ["Mario Reder <mario.reder@pm.me>"]
edition = "2021"

[dependencies]
anyhow.workspace = true
dotenv.workspace = true
near-contract-standards.workspace = true
near-sdk.workspace = true
# 0.21 is required to parse current mainnet RPC responses (0.14 fails with
# `missing field is_slashed`). Pinned per-crate so contract-test can stay on
# 0.14 for the externally-spawned sandbox.
near-workspaces = { version = "0.21", default-features = false }
owo-colors.workspace = true
primitive-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
