[package]
name = "contract-test"
version = "1.0.0"
authors = ["Mario Reder <mario.reder@pm.me>"]
edition = "2021"

[dev-dependencies]
contract-lib = { path = "../contract-lib" }
test-token = { path = "../test-token" }
anyhow.workspace = true
futures.workspace = true
near-contract-standards.workspace = true
near-sdk.workspace = true
# Sandbox tests drive an externally-spawned near-sandbox 2.3.0 via
# `initialize_blockchain`, whose RPC responses near-workspaces 0.21 cannot
# parse. Keep the older client here; mainnet tooling (contract-migrate)
# pins 0.21 separately.
near-workspaces = { version = "0.14", default-features = false }
owo-colors.workspace = true
tokio.workspace = true
